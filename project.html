<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Details | Priyanka Gunjal</title>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        overflow-y: auto !important;
        height: auto !important;
        width: auto !important;
      }
      .subpage-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 4rem 2rem;
        min-height: 100vh;
      }
      .back-nav {
        margin-bottom: 3rem;
        display: inline-block;
        text-decoration: none;
        color: var(--text-color);
        opacity: 0.6;
        transition: opacity 0.3s ease;
        font-family: var(--font-sans);
        font-weight: 500;
      }
      .back-nav:hover { opacity: 1; }

      .project-hero {
        margin-bottom: 4rem;
        animation: fadeIn 0.8s ease forwards;
      }
      .project-category {
        text-transform: uppercase;
        letter-spacing: 0.2em;
        font-size: 0.9rem;
        color: #a29bfe;
        margin-bottom: 1rem;
        display: block;
      }
      .project-title {
        font-family: var(--font-serif);
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        line-height: 1.1;
        margin-bottom: 2rem;
      }
      .project-main-image {
        width: 100%;
        height: 60vh;
        border-radius: 24px;
        overflow: hidden;
        margin-bottom: 4rem;
        box-shadow: 0 30px 60px rgba(0,0,0,0.2);
      }
      .project-main-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .project-grid {
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 4rem;
      }
      .project-meta h3 {
        font-size: 0.8rem;
        text-transform: uppercase;
        opacity: 0.4;
        margin-bottom: 0.5rem;
      }
      .project-meta p { margin-bottom: 2rem; font-weight: 500; }

      .project-description {
        font-size: 1.25rem;
        line-height: 1.6;
        opacity: 0.8;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 768px) {
        .project-grid { grid-template-columns: 1fr; gap: 2rem; }
        .project-main-image { height: 40vh; }
      }
    </style>
  </head>
  <body>

    <div class="subpage-container">
      <a href="index.html" class="back-nav">&larr; Back to Portfolio</a>
      
      <div id="project-content">
        <!-- Dynamic Content Injected Here -->
      </div>

    <script>
      const projectData = {
        lafoxbox: {
          title: "La FoxBox Client Acquisition",
          category: "B2B Commercial & Sales Strategy",
          image: "images/lafoxbox.jpeg",
          description: "Full-cycle sales and GTM acquisition execution for high-value commercial deals in Brussels.<br><br><b>The Challenge:</b> Scaling B2B market visibility, proposal conversion, and client pipeline retention in a competitive market.<br><br><b>The Solution:</b> Implemented a structured CRM sales funnel, tailored commercial & financial proposals, and executed Meta & TikTok lead generation campaigns.<br><br><b>The Results:</b> Closed 6+ high-value client deals in 3 months generating &euro;50K+ in revenue with recurring quarterly pipelines.",
          role: "Business Developer (La FoxBox)",
          year: "2025–Present",
          tools: "HubSpot, Salesforce, Meta Ads, TikTok Ads"
        },
        nutellabakery: {
          title: "Nutella Bakery GTM",
          category: "Global FMCG Brand Management",
          image: "images/nutellabakery.jpeg",
          description: "Global GTM innovation pipeline and portfolio performance strategy for Nutella Fresh Bakery SKUs across EU and US markets at Ferrero HQ.<br><br><b>The Challenge:</b> Maximizing launch readiness and A&P budget ROI across 8+ international markets while maintaining 100% financial compliance.<br><br><b>The Solution:</b> Built PowerBI and Nielsen sell-in/sell-out dashboards, executed market test timelines, and streamlined 200+ DAM e-commerce assets.<br><br><b>The Results:</b> Delivered CEO-level strategic growth recommendations and maintained 100% financial accuracy across multi-million FMCG budgets.",
          role: "Junior Brand Manager Trainee (Ferrero)",
          year: "2024–2025",
          tools: "PowerBI, Nielsen, SAP, DAM"
        },
        schwarzkopf: {
          title: "Schwarzkopf 360 Campaigns",
          category: "FMCG Brand Portfolio Strategy",
          image: "images/schwarzkopf.jpeg",
          description: "Data-driven media optimization and category trend strategy for 3 global FMCG haircare brands at Henkel HQ.<br><br><b>The Challenge:</b> Optimizing digital media ROI and audience messaging across a 20+ SKU portfolio.<br><br><b>The Solution:</b> Developed advanced NielsenIQ & GfK elasticity dashboards, optimized Meta Ads & Google Analytics pacing, and directed influencer copywriting.<br><br><b>The Results:</b> Reached 1M+ global consumers with record campaign engagement and optimized media ROI.",
          role: "Assistant Brand Manager Intern (Henkel)",
          year: "2024",
          tools: "NielsenIQ, GfK, Meta Ads, Google Analytics"
        },
        globalcolliance: {
          title: "Global Colliance",
          category: "360° Growth & Brand Marketing",
          image: "images/globalcolliance.jpeg",
          description: "Architected full-funnel B2B and B2C marketing strategies spanning social media, events, and sponsorships.<br><br><b>The Challenge:</b> Building brand awareness and driving demand creation in a competitive market space.<br><br><b>The Solution:</b> Developed audience-centric content strategies, led a team of 7, and executed Meta Ads & influencer campaigns.<br><br><b>The Results:</b> Accelerated business growth by 35% and generated 400K+ organic and paid views.",
          role: "360 Marketing Manager (Global Colliance)",
          year: "2021–2022",
          tools: "Meta Ads, Social Media, Event Marketing"
        }
      };

      function loadProject() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id') || 'lafoxbox';
        const project = projectData[id];

        if (project) {
          document.title = `${project.title} | Priyanka Gunjal`;
          const container = document.getElementById('project-content');
          container.innerHTML = `
            <div class="project-hero">
              <span class="project-category">${project.category}</span>
              <h1 class="project-title">${project.title}</h1>
              <div class="project-main-image">
                <img src="${project.image}" alt="${project.title}">
              </div>
              <div class="project-grid">
                <div class="project-meta">
                  <div>
                    <h3>Role</h3>
                    <p>${project.role}</p>
                  </div>
                  <div>
                    <h3>Year</h3>
                    <p>${project.year}</p>
                  </div>
                  <div>
                    <h3>Tools</h3>
                    <p>${project.tools}</p>
                  </div>
                </div>
                <div class="project-description">
                  <p>${project.description}</p>
                </div>
              </div>
            </div>
          `;
        }
      }

      // Initialize
      window.onload = loadProject;

      // Theme Sync
      const savedTheme = localStorage.getItem('portfolio-theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
      }
    </script>
    <script src="script.js"></script>
  </body>
